<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EM TOP UP SHOP - Recharges & Cartes Virtuelles</title>
  <style>
    :root {
      --primary-color: #0f172a;
      --accent-color: #2563eb;
      --success-color: #16a34a;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #334155;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 28px;
      margin-bottom: 5px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #64748b;
      font-size: 15px;
      margin: 0;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 850px;
    }

    .card {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      text-align: left;
      border-top: 4px solid var(--accent-color);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card h2 {
      color: var(--primary-color);
      font-size: 20px;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      display: block;
      margin: 15px 0 6px;
      font-weight: 600;
      font-size: 13px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #f8fafc;
      color: #1e293b;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-color);
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: var(--success-color);
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-size: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    button:hover {
      background-color: #15803d;
      box-shadow: 0 6px 15px rgba(22, 163, 74, 0.3);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <h1>EM TOP UP SHOP</h1>
    <p class="subtitle">Service rapide et sécurisé pour recharges de jeux et cartes virtuelles</p>
  </header>

  <div class="container">
